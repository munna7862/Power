name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: End-to-end tests (Chrome)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright
          retention-days: 7

  balance:
    name: Balance KPIs (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reported on every PR but not yet a merge gate (Phase 2 plan); becomes blocking in Sprint 6.1.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run balance harness (50 seeds x 5 years x 3 bots)
        run: npm run balance

      - name: Publish balance summary
        if: always()
        run: cat reports/balance/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload balance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: reports/balance
          retention-days: 14
